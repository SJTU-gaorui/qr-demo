<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫码测试页 · DeepSeek Harness</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1d4ed8 0%, #0b1220 55%, #05070d 100%);
    color: #e8eefc;
  }
  main { padding: 40px 28px; max-width: 520px; text-align: center; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
    border-radius: 999px; background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.35);
    color: #7dd3fc; font-size: 13px; letter-spacing: .04em;
  }
  h1 { font-size: 30px; margin: 22px 0 12px; letter-spacing: .01em; }
  p { line-height: 1.75; color: #a9b8d4; margin: 0 0 10px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #e2e8f0; background: rgba(148,163,184,.14); padding: 2px 7px; border-radius: 6px; font-size: .92em; }
  footer { margin-top: 26px; font-size: 12px; color: #6b7c9c; }
</style>
</head>
<body>
<main>
  <span class="badge">GitHub Pages · 已上线</span>
  <h1>扫码成功</h1>
  <p>这个页面由 DeepSeek Harness 的 <code>page-publisher</code> 插件发布。</p>
  <p>从生成网页、发布到 GitHub Pages、到生成二维码，整条链路现在是通的。</p>
  <footer>SJTU-gaorui / qr-demo</footer>
</main>
</body>
</html>
